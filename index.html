<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration</title>
  <style>
    :root {
      --primary-color: #2563eb;
      --primary-hover: #1d4ed8;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-color: #0f172a;
      --border-color: #cbd5e1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .form-container {
      background: var(--card-bg);
      padding: 32px;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 640px;
    }

    h2 {
      margin-bottom: 8px;
      color: var(--text-color);
      font-size: 1.6rem;
      text-align: center;
    }

    p.subtitle {
      text-align: center;
      color: #64748b;
      font-size: 0.95rem;
      margin-bottom: 24px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    .full-width {
      grid-column: span 2;
    }

    label {
      margin-bottom: 6px;
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text-color);
    }

    input, select {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 0.95rem;
      background-color: #fff;
      transition: all 0.2s ease;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    button {
      margin-top: 20px;
      width: 100%;
      padding: 14px;
      background-color: var(--primary-color);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    button:hover {
      background-color: var(--primary-hover);
    }

    button:disabled {
      background-color: #93c5fd;
      cursor: not-allowed;
    }

    .status-msg {
      margin-top: 16px;
      text-align: center;
      font-size: 0.9rem;
      font-weight: 500;
      display: none;
    }

    .status-msg.success { color: #16a34a; display: block; }
    .status-msg.error { color: #dc2626; display: block; }

    /* Mobile Responsive Styles */
    @media (max-width: 600px) {
      .form-grid {
        grid-template-columns: 1fr;
      }
      .full-width {
        grid-column: span 1;
      }
      .form-container {
        padding: 20px;
      }
    }
  </style>
</head>
<body>

  <div class="form-container">
    <h2>Student Information Form</h2>
    <p class="subtitle">Please fill in your academic details below</p>

    <form id="studentForm">
      <div class="form-grid">
        
        <div class="form-group">
          <label for="studentId">Student ID</label>
          <input type="text" id="studentId" required placeholder="e.g. ST12345">
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" required placeholder="student@example.com">
        </div>

        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" required placeholder="+1 234 567 8900">
        </div>

        <div class="form-group">
          <label for="semester">Semester</label>
          <select id="semester" required>
            <option value="" disabled selected>Select Semester</option>
            <option value="1">Semester 1</option>
            <option value="2">Semester 2</option>
            <option value="3">Semester 3</option>
            <option value="4">Semester 4</option>
            <option value="5">Semester 5</option>
            <option value="6">Semester 6</option>
            <option value="7">Semester 7</option>
            <option value="8">Semester 8</option>
          </select>
        </div>

        <div class="form-group full-width">
          <label for="collegeName">College Name</label>
          <input type="text" id="collegeName" required placeholder="e.g. Harvard University">
        </div>

        <div class="form-group">
          <label for="course">Course / Degree</label>
          <input type="text" id="course" required placeholder="e.g. B.Tech, B.Sc">
        </div>

        <div class="form-group">
          <label for="department">Department</label>
          <input type="text" id="department" required placeholder="e.g. Computer Science">
        </div>

      </div>

      <button type="submit" id="submitBtn">Submit Details</button>
      <div id="statusMsg" class="status-msg"></div>
    </form>
  </div>

  <script>
    // Paste your Google Apps Script Web App URL here
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxkf7jGpTIiqy6qxJhzYFTk_lOBoCxG0o73wXEko-ObeyO4cjq4wYoAJNC2iUODj_Ej/exec';

    const form = document.getElementById('studentForm');
    const submitBtn = document.getElementById('submitBtn');
    const statusMsg = document.getElementById('statusMsg');

    form.addEventListener('submit', e => {
      e.preventDefault();

      submitBtn.disabled = true;
      submitBtn.innerText = 'Submitting...';
      statusMsg.className = 'status-msg';
      statusMsg.innerText = '';

      const payload = {
        studentId: document.getElementById('studentId').value,
        email: document.getElementById('email').value,
        phone: document.getElementById('phone').value,
        collegeName: document.getElementById('collegeName').value,
        course: document.getElementById('course').value,
        department: document.getElementById('department').value,
        semester: document.getElementById('semester').value
      };

      fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      })
      .then(() => {
        statusMsg.innerText = 'Success! Your information has been submitted.';
        statusMsg.classList.add('success');
        form.reset();
      })
      .catch(error => {
        statusMsg.innerText = 'Submission failed. Please try again.';
        statusMsg.classList.add('error');
        console.error('Error!', error.message);
      })
      .finally(() => {
        submitBtn.disabled = false;
        submitBtn.innerText = 'Submit Details';
      });
    });
  </script>
</body>
</html>
